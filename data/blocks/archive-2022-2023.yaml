  - date: 2022-09-21
    speaker: "Boaz Moerman"
    title: "\"Weak approximation and the Hilbert property for Campana points\" by Nakahara and Streeter, arXiv:2010.12555"
    note: "preprint talk"
  - date: 2022-10-05
    speaker: "Dusan Dragutinovic"
    title: "Computing binary curves of genus five"
    abstract: >-
      In this talk, we will present algorithms used to determine, up to isomorphism over
      $\mathbb{F}_2$, all genus five curves defined over $\mathbb{F}_2$ (together with the
      sizes of their $\mathbb{F}_2$-automorphism groups). Furthermore, we will discuss the
      outcome considering the Newton polygons of computed curves and mention the obtained
      stack count $|\mathcal{M}_5(\mathbb{F}_2)|$.
  - date: 2022-10-12
    speaker: "Remy van Dobben de Bruyn"
    title: "A variety that cannot be dominated by one that lifts"
    abstract: >-
      The recent proofs of the Tate conjecture for K3 surfaces over finite fields start by
      lifting the surface to characteristic 0. Serre showed in the sixties that not every
      variety can be lifted, but the question whether every motive lifts to characteristic 0
      is open. We give a negative answer to a geometric version of this question, by
      constructing a smooth projective variety that cannot be dominated by a smooth projective
      variety that lifts to characteristic 0.
    room: "HFG-409"
  - date: 2022-10-19
    speaker: "Carel Faber"
    title: "\"On the Chow and cohomology rings of moduli spaces of stable curves\" by Canning and Larson, arXiv:2208.02357"
    room: "HFG-409"
    note: "preprint talk"
  - date: 2022-10-26
    speaker: "Reinier Schmiermann"
    title: "On Classifying Continuous Constraint Satisfaction Problems"
    abstract: >-
      The computational complexity class of the existential theory of the reals contains
      problems which can be reduced to checking whether a system of polynomial equations has a
      solution over the real numbers. The complexity of a lot of problems in computational
      geometry turns out to be captured by this class (they are complete for this class).
      These completeness proofs often use the completeness of a specific Continuous Constraint
      Satisfaction Problem (CCSP) as an intermediate step. We attempt to give a more
      systematic analysis of the computational complexity of these CCSPs, and show that a
      large class of CCSPs is complete for the existential theory of the reals. In this talk,
      I will give a introduction to computational complexity, the existential theory of the
      reals, and CCSPs. Then I will state our results, and give a sketch of the proof. This
      talk is based on joint work with Tillmann Miltzow.
    room: "HFG-409"
  - date: 2022-11-16
    speaker: "Francesca Carocci"
    affiliation: "EPFL"
    title: "BPS invariant from non Archimedean integrals"
    abstract: >-
      We consider moduli spaces of one-dimensional semistable sheaves on del Pezzo and K3
      surfaces supported on ample curve classes. Working over a non-archimedean local field
      $F$, we define a natural measure on the $F$-points of such moduli spaces. We prove that
      the integral of a certain naturally defined gerbe on the moduli spaces with respect to
      this measure is independent of the Euler characteristic. Analogous statements hold for
      (meromorphic or not) Higgs bundles. Recent results of Maulik-Shen and Kinjo-Coseki imply
      that these integrals compute the BPS invariants for the del Pezzo case and for Higgs
      bundles. This is a joint work with Giulio Orecchia and Dimitri Wyss.
    room: "HFG-409"
  - date: 2022-11-23
    speaker: "Mar Curco Iranzo"
    affiliation: "UU"
    title: 'Generalised Jacobians of modular curves and their $\mathbb{Q}$-rational torsion'
    abstract: >-
      The Jacobian $J_0(N)$ of the modular curve $X_0(N)$ has received much attention within
      arithmetic geometry for its relation with cusp forms and elliptic curves. In particular,
      the group of $\mathbb{Q}$-rational points on $X_0(N)$ controls the cyclic $N$-isogenies
      of elliptic curves. A conjecture of Ogg predicted that, for $N$ prime, the torsion of
      this group comes all from the cusps. The statement was proved by Mazur and later
      generalised to arbitrary level $N$ into what we call generalised Ogg’s conjecture.
      Consider now the generalised Jacobian $J_0(N)_m$ with respect to a modulus $m$. This
      algebraic group also seems to be related to the arithmetic of $X_0(N)$ through the
      theory of modular forms. In the talk we will present new results that compute the
      $\mathbb{Q}$-rational torsion of $J_0(N)$ for $N$ an odd integer with respect to a
      cuspidal modulus $m$. These generalise previous results of Yamazaki, Yang and Wei. In
      doing so, we will also discuss how our results relate to generalised Ogg’s conjecture.
    room: "HFG-409"
  - date: 2022-11-30
    speaker: "Navid Nabijou"
    affiliation: "QMU London"
    title: "Roots and logs in the enumerative forest"
    abstract: >-
      Logarithmic and orbifold structures provide two different paths to the enumeration of
      curves with fixed tangencies to a normal crossings divisor. Simple examples demonstrate
      that the resulting systems of invariants differ, but a more structural explanation of
      this defect has remained elusive. I will discuss joint work with Luca Battistella and
      Dhruv Ranganathan, in which we identify birational invariance as the key property
      distinguishing the two theories. The logarithmic theory is stable under strata blowups
      of the target, while the orbifold theory is not. By identifying a suitable system of
      “slope-sensitive” blowups, we define a “limit" orbifold theory and prove that it
      coincides with the logarithmic theory. Our proof hinges on a technique – rank reduction
      – for reducing questions about normal crossings divisors to questions about smooth
      divisors, where the situation is much-better understood.
    room: "HFG-409"
  - date: 2022-12-07
    speaker: "Leo Herr"
    affiliation: "Leiden University"
    title: "The Rhizomic Topology"
    abstract: >-
      What is a sheaf on a log scheme $X$? If we take the ordinary etale topology, we ignore
      the log structure. Taking the log étale topology, even the structure "sheaf"
      $\mathcal{O}_X$ is not a sheaf! The same goes for $M_X$, $\overline{M}_X$. We introduce
      a new "rhizomic" topology on log schemes coarser than the log etale topology. Will this
      be enough?
    room: "HFG-409"
  - date: 2023-01-11
    time: "11:00"
    speaker: "Lars Halvard Halle"
    affiliation: "University of Bologna"
    title: "Degenerations of Hilbert schemes and relative VGIT"
    abstract: >-
      This talk will be a report on joint work with K. Hulek and Z. Zhang. First I will
      explain how some central results in VGIT can be extended to a relative setting. After
      this, I will discuss an application of relative VGIT to the study of certain
      degenerations of Hilbert schemes of points.
    room: "HFG-409"
  - date: 2023-01-18
    time: "10:00"
    speaker: "Mick van Vliet"
    affiliation: "UU"
    title: "Tame geometry and Hodge theory"
    abstract: >-
      Tame geometry, made precise by the concept of o-minimal structures, has recently led to
      some interesting developments in algebraic geometry. In the first half of this talk I
      will motivate and explain the definition of o-minimal structures, and review some
      remarkable theorems that hold in the resulting framework of tame geometry. In the second
      half of the talk, based on work of Bakker, Klingler, and Tsimerman (1810.04801), I will
      give an overview of a recent application of tame geometry to Hodge theory.
    room: "HFG-409"
  - date: 2023-02-01
    time: "11:00"
    speaker: "Olivier de Gaay Fortman"
    affiliation: "Hannover"
    title: "Real moduli spaces, unitary Shimura varieties and non-arithmetic lattices"
    abstract: >-
      Hodge theory can sometimes be used to identify a moduli space of complex varieties with
      a complex ball quotient, or an open subset of such a space. I will explain that similar
      things happen for moduli of real varieties. Real moduli spaces of smooth varieties are
      often not connected, however - to get a connected moduli space one is led to allow some
      singularities. It turns out that, very similar to the way in which the connected
      components of the space of smooth varieties embed into the larger moduli space, real
      arithmetic ball quotients can be glued together to form a large real ball quotient.
      Unitary Shimura varieties provide the right framework for this glueing procedure. I will
      explain how this works, constructing non-arithmetic lattices in
      $\operatorname{PO}(n,1)$ for every $n$.
    room: "HFG-409"
  - date: 2023-02-08
    time: "13:30"
    speaker: "Hyeonjun Park"
    affiliation: "KIAS"
    title: "Cosection localization via derived algebraic geometry"
    abstract: >-
      Cosection localization is one of the most powerful tools in virtual enumerative
      geometry. In this talk, we revisit cosection localization from the perspective of
      derived algebraic geometry. I will explain derived reduction by $(-1)$-shifted
      closed 1-forms and localization through homotopical intersection theory. I will also
      provide an intrinsic description of cosection-localized virtual cycles using
      $(-2)$-shifted
      symplectic structures. This is based on joint works with Younghan Bae and Martijn Kool,
      with Dhyan Aranha, Adeel Khan, Alexei Latyntsev, and Charanya Ravi, and with Young-Hoon
      Kiem.
    room: "HFG-409"
  - date: 2023-02-15
    time: "13:30"
    speaker: "Andreas Braun"
    affiliation: "Durham"
    title: "Hodge classes on Calabi-Yau fourfolds"
    abstract: >-
      A crucial question in string theory concerns its set of solutions, particularly those
      giving rise to an effective four-dimensional description. The most general such
      solutions are found by specifying a Calabi-Yau fourfold equipped with an elliptic
      fibration, together with a Hodge class. Without assuming any background I will briefly
      explain how these objects arise in physics, and which constraints they need to obey.
      After formulating some of the central questions and conjectures that arise in this
      context, I will discuss some recent progress.
    room: "BBG-069"
  - date: 2023-03-01
    time: "13:30"
    speaker: "Stefano Marseglia"
    affiliation: "UU"
    title: "Cohen-Macaulay type of endomorphism rings of abelian varieties over finite fields"
    abstract: >-
      In this talk, we will speak about the (Cohen-Macaulay) type of the endomorphism ring of
      abelian varieties over a finite field with commutative endomorphism algebra. We will
      exhibit a condition on the type of $\operatorname{End}(A)$ implying that $A$ cannot be
      isomorphic to its dual. In particular, such an $A$ cannot be principally polarised or a
      Jacobian. This is
      partly joint work with Caleb Springer.
    room: "HFG-409"
  - date: 2023-03-15
    time: "13:30"
    speaker: "Henry Liu"
    affiliation: "Oxford"
    title: "Multiplicative vertex algebras and wall-crossing in equivariant $K$-theory"
    abstract: >-
      I will give an overview of recent progress in wall-crossing for equivariant
      $K$-theoretic
      invariants of moduli of sheaves, based on a new framework of Joyce. A multiplicative
      version of vertex algebras plays a central role in this and related stories. I will give
      some applications to refined Vafa-Witten theory, the 3-fold DT/PT correspondence, and,
      if time permits, also some speculation about modularity and $S$-duality.
    room: "HFG-409"
  - date: 2023-03-22
    time: "13:30"
    speaker: "Sara Mehidi"
    affiliation: "Bordeaux"
    title: "Extending torsors via log schemes"
    abstract: >-
      We give here an approach of the problem of extending torsors defined on the generic
      fiber of a family of curves. The question is to extend each of the structural group and
      the total space of the torsor above the family. This problem has been studied by many
      researchers, starting by the first ideas of Grothendieck who solved the case of a
      constant group of order prime to the residual characteristic. When we are interested in
      algebraic varieties from an arithmetic point of view, it is natural to consider torsors
      under a finite flat group that is not necessarily constant: we talk about fppf torsors.
      In fact, we know from the literature that there are cases where the problem does not
      have a solution in this setting. So the idea is to look for a solution in a larger
      category, namely the category of logarithmic torsors. We will show in particular that
      the existence of such an extension amounts to extending group functors and morphisms
      between them. Then, we will compute the obstruction for the extended log torsor to lift
      into an fppf one. Finally, we give an example of a computation of an extension of a
      torsor over a given hyperelliptic curve as an application of our results.
    room: "HFG-409"
  - date: 2023-04-05
    time: "13:30"
    speaker: "Fabian Reede"
    affiliation: "Hannover"
    title: "Line bundles on noncommutative algebraic surfaces"
    abstract: >-
      Let $X$ be a complex algebraic surface. Let $A$ be a (noncommutative) coherent
      $\mathcal{O}_X$-algebra whose generic stalk is a central division algebra. Then the
      pair $(X,A)$ can be thought of as a noncommutative algebraic surface. This talk
      deals with the moduli space of line bundles on $(X,A)$, i.e., of locally free
      $A$-modules of rank one, in the cases where $X$ has Kodaira dimension zero or is
      Fano. It turns out that the moduli space can be compactified by adding torsion-free
      $A$-modules of rank one. We will study e.g. the smoothness of this compactification
      and the deformation theory of the sheaves involved. This is partly joint work with
      U. Stuhler and with N.Hoffmann.
    room: "HFG-409"
  - date: 2023-04-18
    time: "13:30-15:30"
    speaker: "Carolina Tamborini"

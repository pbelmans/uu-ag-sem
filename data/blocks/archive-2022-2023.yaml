  - date: 2023-05-03
    time: "13.30-14.30"
    speaker: "Chia-Fu Yu"
    affiliation: "Academia Sinica, Taiwan"
    title: "Arithmetic invariants on supersingular Ekedahl-Oort (EO) strata for $g=4$"
    abstract: >-
      The supersingular locus is one of main interests in algebraic geometry in
      characteristic $p$, and can be described in terms of polarised flag type quotients
      (PFTQs) in the sense of Li and Oort. The description for $g=3$ is rather explicit and
      is exploited by Karemaker and Yobuko and myself for investigating the arithmetic
      invariants of supersingular abelian threefolds, namely, the endomorphism rings and
      automorphism groups of them, confirming Oort's conjecture for $g=3$. In this talk we
      shall explain a general method for investigating the arithmetic invariants on
      supersingular EO strata, and report the progress of the joint work with Karemaker
      for $g=4$.
    room: "HFG 409"
  - date: 2023-05-10
    time: "11:30-12:30"
    speaker: "Thorsten Schimannek"
    affiliation: "CNRS LPTHE"
    title: "Counting curves on non-Kaehler Calabi-Yau 3-folds with Topological Strings"
    abstract: >-
      In general, a projective Calabi-Yau threefold with nodal singularities does not admit a
      Kaehler small resolution. This happens in particular if the exceptional curves are
      torsion in homology. In this talk we will discuss how the classical relationship between
      topological string theory, enumerative geometry and mirror symmetry generalizes to this
      setting. After recalling some of the ideas from the smooth case, we will both explain
      the physical intuition behind the generalization and translate it into a concrete
      mathematical proposal. At the end of the talk, if time permits, we will highlight some
      open questions that follow from this proposal, related to Donaldson-Thomas theory,
      non-commutative geometry, and FJRW-theory.
    room: "MIN 2.01"
  - date: 2023-05-17
    time: "11:30-12:30"
    speaker: "Samir Canning"
    affiliation: "ETH"
    title: "Semi-tautological systems and the cohomology of the moduli space of curves"
    abstract: >-
      I will introduce the notion of semi-tautological systems, which are systems of
      subalgebras with minimal set of functoriality properties of the cohomology rings of the
      moduli spaces of stable curves. They are designed to study the structure of the
      cohomology of the moduli spaces of stable curves beyond the tautological ring. I will
      give a criterion for a given semi-tautological system to span all of cohomology in a
      given degree. Using this criterion and other results about the moduli space of curves,
      both topological and algebro-geometric, I will give several applications. These
      applications include a complete description of the thirteenth cohomology of the moduli
      space of stable $n$ pointed curves of genus $g$ for all $g,n$ and that all cohomology
      classes
      of sufficiently high degree are tautological. This is joint work in progress with Hannah
      Larson and Sam Payne.
    room: "HFG 409"
  - date: 2023-05-24
    time: "11:30-12:30"
    speaker: "Nancy Abdallah"
    affiliation: "University of Borås"
    title: "Lefschetz properties of Artin Gorenstein algebras in low codimensions"
    abstract: >-
      The weak and strong Lefschetz properties (WLP and SLP) has been much studied for
      Artinian algebras. Codimension two Artinian algebras over a field of characteristic zero
      have the strong Lefschetz property. It is open whether Artin Gorenstein (AG) algebras of
      codimension $c=3$ satisfy the weak or strong Lefschetz properties. Harima, Migliore,
      Nagel, and Watanabe proved that complete intersection algebras of codimension three
      satisfy the weak Lefschetz property. For $c=4$, Gondim showed that WLP always holds for
      regularity $r = 7$, building on an earlier example of Ikeda of failure for $r=5$. In
      this
      talk we go through an overview of Lefschetz properties over AG algebras and we give some
      recent results in codimensions 3 and 4. In codimension 4 we explore relations between
      Lefschetz properties of an AG algebra $A$ and the free resolutions of $A$. Lefschetz
      properties of the Milnor algebras of projective hypersurfaces will be discussed.
    room: "HFG 409"
  - date: 2023-06-07
    time: "11:30-12:30"
    speaker: "Jeongseok Oh"
    affiliation: "Imperial College, KIAS"
    title: "Koszul factorisations of moduli spaces and invariants"
    abstract: >-
      Invariants on moduli spaces are defined to be integrations over the virtual fundamental
      classes or Euler characteristics of the virtual structure sheaves. Roughly a virtual
      structure sheaf is a Koszul resolution of the structure sheaf and the virtual
      fundamental class is its Chern character (multiplied by Todd class). In fact their first
      algebraic constructions by Li-Tian and Behrend-Fantechi look different. Here we explain
      these two are the same in a reasonable circumstance. Furthermore, we explain the use of
      Koszul factorisations rather than Koszul resolutions gives rise to Kiem-Li localisations
      of Li-Tian and Behrend-Factechi constructions. These are joint works with Bumsig Kim and
      Bhamidi Sreedhar. We can use these to produce invariants of moduli spaces of stable
      sheaves on Calabi-Yau 4-folds as explained in the joint work with Richard Thomas.
    room: "HFG 409"
  - date: 2023-06-14
    time: "11:30-12:30"
    speaker: "Gergely Berczi"
    affiliation: "Aarhus"
    title: "Tautological intersection theory of Hilbert scheme of points"
    abstract: >-
      While the Hilbert scheme of points on surfaces is pretty well-understood, the Hilbert
      scheme over manifolds presents a mixture of pathological and unknown behaviour: our
      knowledge of their components, singularities and deformation theory is very limited.
      After a brief survey we report on a new approach to calculate tautological intersection
      numbers of geometric subsets which play crucial role in enumerative geometry
      applications. We present a Chern-Segre-type positivity conjecture for tautological
      integrals coming from global singularity theory.
    room: "HFG 409"
  - date: 2023-06-21
    time: "11:30-12:30"
    speaker: "Lou van den Dries"
    affiliation: "University of Illinois at Urbana-Champaign"
    title: "Transseries and Hardy Fields"
    abstract: >-
      Transseries are formal series involving $\exp$ and $\log$. The differential field of
      transseries is a universal domain for algebraic differential equations with asymptotic
      side conditions (in analogy with the field of complex numbers being a universal domain
      for algebraic geometry). I will then apply this to Hardy fields. Until recently there
      were only very limited ways of extending Hardy fields, but recently we have achieved a
      more or less complete overview. I will start from scratch and define/explain transseries
      and Hardy fields, including examples. (Joint work with Matthias Aschenbrenner and Joris
      van der Hoeven.)
    room: "BBG 165"
  - date: 2023-06-23
    time: "14:00-15:00"
    speaker: "Aline Zanardini"
    affiliation: "Leiden University"
    title: "Pencils of plane cubics revisited"
    abstract: >-
      In recent joint work with M. Hattori we have considered the problem of classifying
      linear systems of hypersurfaces (of a fixed degree) in some projective space up to
      projective equivalence via geometric invariant theory (GIT). And we have obtained a
      complete and explicit stability criterion. In this talk I will explain how this
      criterion can be used to recover Miranda's description of the GIT stability of pencils
      of plane cubics.
    room: "HFG 409"
  - date: 2023-06-28
    time: "11:30-12:30"
    speaker: "Sarah Arpin"
    affiliation: "Leiden"
    title: "Adding level structure to supersingular elliptic curve isogeny graphs"
    abstract: >-
      The classical Deuring correspondence provides a roadmap between supersingular elliptic
      curves and the maximal orders which are isomorphic to their endomorphism rings. Building
      on this idea, we add the information of a cyclic subgroup of prime order $N$ to
      supersingular elliptic curves, and prove a generalisation of the Deuring correspondence
      for these objects. We also study the resulting $\ell$-isogeny graphs supersingular
      elliptic curve with level-$N$ structure, and the corresponding graphs in the realm of
      quaternion algebras. The structure of the supersingular elliptic curve $\ell$-isogeny
      graph underlies
      the security of a new cryptographic signature protocol, SQISign, which is proposed to be
      resistant against both classical and quantum attack.
    room: "HFG 409"

  - date: 2023-04-19
    time: "13:30-14:30"
    speaker: "Oliver Leigh"
    affiliation: "Uppsala"
    title: "The Blowup Formula for the Instanton Part of Vafa-Witten Invariants on Projective Surfaces"
    abstract: >-
      In this talk I will present a blow-up formula for the generating series of virtual
      $\chi_y$-genera for moduli spaces of sheaves on projective surfaces. The formula is
      related to a conjectured formula for topological $\chi_y$-genera of Göttsche, and is
      a refinement of a formula of Vafa-Witten relating to $S$-duality. I will also discuss
      the proof of the formula, which is based on the blow-up algorithm of Nakajima-Yoshioka
      for framed sheaves on $\mathbb{P}^2$. This talk is based on joint work with Nikolas
      Kuhn and Yuuji Tanaka.
    room: "HFG-409"

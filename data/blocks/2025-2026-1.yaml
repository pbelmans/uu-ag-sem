  - date: 2025-09-23
    speaker: "Oliver Lorscheid"
    affiliation: "University of Groningen"
    title: "On a theorem of Lafforgue"
    abstract: >-
      A folklore theorem attibuted to Laurent Lafforgue states that the thin Schubert cell of
      a rigid matroid is the union of finitely many torus orbits. After a gentle introduction
      to matroids and thin Schubert cells, bands and matroid representations, we explain a
      short conceptual proof of this theorem, which traces it back to the Bieri-Groves theorem
      for tropicalizations. All of this is joint work with Matt Baker.
  - date: 2025-09-30
    speaker: "Theresa Anderson"
    affiliation: "Carnegie Mellon University"
    title: "Characterizing random polynomials"
    abstract: >-
      How likely is a polynomial pulled from a box likely to have certain characteristics?
      We'll make this question precise in different ways and give some answers using a
      delightful interplay of tools and techniques. This journey is as much about the
      statistics as it is about connecting the mathematical landscape.
  - date: 2025-10-06
    speaker: "Balázs Szendrői"
    affiliation: "Vienna"
    title: "The projective coinvariant algebra"
    abstract: >-
      The coinvariant algebra, the quotient of the coordinate ring of
      $(\mathbb{A}^1)^n=\mathbb{A}^n$ by the ideal generated by positive degree invariant
      polynomials, plays a basic role in algebraic combinatorics and the representation
      theory of the symmetric group $S_n$, equipping its regular representation with a
      graded algebra structure. Using the coordinate ring of $(\mathbb{P}^1)^n$ in its
      Segre embedding, I will introduce a degeneration of the coinvariant algebra, the
      projective coinvariant algebra, which gives a bigraded structure on the regular
      representation of $S_n$ with interesting Frobenius character that generalises a
      classical result of Lusztig and Stanley. I will also show how this algebra contains
      bigraded versions of partial coinvariant algebras, coming from coordinate rings of
      all possible Segre embeddings. Relations to Haiman's diagonal coinvariant algebra,
      and a certain equivariant Hilbert scheme, will also be discussed.
    note: "special lecture on the occasion of Reinier Schmiermann's PhD defense"
  - date: 2025-10-14
    speaker: "Christian Merten"
    affiliation: "Utrecht University"
    title: "Formalising the étale fundamental group of a scheme"
    abstract: >-
      Formalising mathematics is the process of teaching mathematics to a proof assistant such
      as Lean. While sometimes this is a mechanical translation process, most often it
      requires mathematical insights on how to encode the mathematical objects efficiently in
      a formal language. Lean's mathematical library mathlib aims to provide unified
      foundations and definitions for all of mathematics. This objective requires every
      formalisation to fit in a bigger picture, often leading to a gap between pen-and-paper
      mathematics and its formal counterpart. In my talk, after giving a brief introduction to
      Lean, I will explain how we bridge this gap in the area of algebraic geometry using the
      example of the formalisation of the étale fundamental group of a scheme highlighting
      some of the unforeseen difficulties encountered during the formalisation.
    room: "Minnaert 2.01"
  - date: 2025-10-21
    speaker: "Olivier de Gaay Fortman"
    affiliation: "Utrecht University"
    title: "Failure of the integral Hodge conjecture for abelian varieties and the existence of non stably rational cubic threefolds"
    abstract: >-
      In this first lecture, I will first provide an introduction to the general framework:
      the integral Hodge conjecture, which is a property that can hold or fail for smooth
      projective varieties over the complex numbers. Examples of varieties that fail that
      property were provided for the first time by Atiyah and Hirzebruch. Nonetheless, there
      are interesting classes of varieties that do satisfy the integral Hodge conjecture. I
      will also explain in this lecture the connection between the integral Hodge conjecture
      for abelian varieties and (stable) rationality of cubic threefolds, as discovered by
      Clemens—Griffiths and Voisin. I will present the two main theorems of our work, which
      imply that the integral Hodge conjecture for abelian varieties fails, and that not every
      smooth cubic threefold is stably rational. I will sketch an overview of the proof.
    note: "lecture series, part I"
  - date: 2025-10-23
    time: "11 a.m"
    speaker: "Taro Kimura"
    affiliation: "Institut de Mathématiques de Bourgogne"
    title: "How to compute enumerative invariants from residues?"
    abstract: >-
      Many examples of enumerative invariants appearing in the context of algebraic geometry
      are given by integrating over the moduli space of maps, sheaves, and so on. When there
      exists a nice group action on it, we may compute such invariants based on the fixed
      point contributions, i.e., the equivariant localization formula. In this talk, I'd like
      to explain an alternative use of the localization formula based on the Jeffrey-Kirwan
      residue formula for multi-variable contour integrals. The key idea is to use the residue
      of the poles appearing in the integral to classify and evaluate the fixed point
      contribution under the equivariant action. I'll demonstrate this formalism with
      several examples, including the equivariant DT/PT invariants for the affine spaces
      $\mathbb{C}^3$ and $\mathbb{C}^4$.
    note: "special lecture"
  - date: 2025-10-27
    time: "11 a.m"
    speaker: "Jan Manschot"
    affiliation: "Trinity College"
    title: "Topologically twisted Yang-Mills theories and invariants of moduli spaces"
    abstract: >-
      I will discuss invariants of moduli spaces of instantons on a four-manifold, and their
      relation to topologically twisted Yang-Mills theory. After reviewing general aspects, I
      will explain recent work on Segre invariants and $K$-theoretic Donaldson
      invariants, and the physical theories whose correlations functions capture these
      invariants.
    note: "special lecture"
  - date: 2025-10-28
    speaker: "Olivier de Gaay Fortman"
    affiliation: "Utrecht University"
    title: "Degenerations of abelian varieties associated to regular matroids"
    abstract: >-
      Mumford constructed degenerations of abelian varieties in his influential paper ''An
      analytic construction of degenerating abelian varieties over complete rings.'' In this
      second lecture, I will explain the main ideas behind the Mumford construction in the
      complex analytic setting, in which toric geometry plays a key role. I will also
      introduce the notion of matroid, and explain how to associate a degeneration of abelian
      varieties over a higher dimensional base to a regular matroid. This lecture will be
      based on the paper ''Combinatorics and Hodge theory of degenerations of abelian
      varieties: A survey of the Mumford construction'' by Engel, Schreieder and myself.
    room: "HFG 7.07 See the Mathematical Institute Calendar for rest of the lectures."
    note: "lecture series, part II"
  - date: 2025-11-04
    speaker: "Aitor Iribar Lopez"
    affiliation: "ETH Zurich"
    title: "Abelian varieties with elliptic subgroups"
    abstract: >-
      The locus of principally polarized abelian varieties with elliptic subgroups
      provides interesting cycles on the moduli space $A_g$. The cycles provide
      non-tautological classes. The interaction between these cycles, the locus of
      Jacobians and the tautological projection (recently developed by Canning, Molcho,
      Oprea and Pandharipande) gives a prediction for Gromov-Witten invariants of a family
      of elliptic curves, which now have been verified in joint work with Rahul
      Pandharipande and Hsian Hua Tseng. In the talk I will recall the definition of the
      tautological ring of $A_g$, explain the main results on Noether-Lefschetz cycles and
      discuss the ideas between two proofs of the mentioned prediction. If time allows, I
      will talk about modularity of these cycles.

  - date: 2026-06-02
    speaker: "Sièna van Schaick"
    affiliation: "Radboud University"
    title: "Points of low degree on curves over function fields"
    abstract: >-
      The degree of a closed point on a curve is the degree of the field extension given by
      the residue field of the point extending the ground field. Theorems by Faltings,
      Harris-Silverman, Abramovich-Harris and Kadets-Vogt geometrically classify curves over
      number fields having a potentially dense set of points of degree 1, 2, 3, 4 and 5. I
      will explain how to generalize these results to curves over function fields of
      characteristic zero.
  - date: 2026-06-09
    speaker: "Arkadij Bojko"
    affiliation: "SIMIS"
    title: "$T$-deformations of vertex algebras and tautological stable pair wall-crossing"
    abstract: >-
      There are two natural ways to deform Joyce's construction of vertex algebras. One is to
      work equivariantly, and the other is to include tautological insertions. I introduce
      $T$-deformed vertex algebras that unify these two refinements. For the purpose of
      wall-crossing, they must be treated differently because the associated Lie algebras use
      different expansions. I will explain this behavior explicitly by applying it to
      2-dimensional stable pair wall-crossing, focusing on conjectures of Bae-Kool-Park.

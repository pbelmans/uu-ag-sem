  - date: 2026-04-23
    time: "15.30"
    speaker: "Philip Engel"
    affiliation: "University of Illinois Chicago"
    title: "Boundedness of Lagrangian fibrations"
    abstract: >-
      I will discuss recent work showing that deformation classes of symplectic varieties
      admitting a Lagrangian fibration, and of fixed dimension, are finite in number.
      Conditional on the generalized semiampleness conjecture, we deduce a bound on the number
      of deformation classes of hyperkahler varieties in a fixed dimension, with second Betti
      number at least 5. This is joint work with Filipazzi, Greer, Mauri, and Svaldi.
    room: "BBG 1.61"
  - date: 2026-04-28
    speaker: "Yajnaseni Datta"
    affiliation: "Leiden University"
    title: "Crepant resolution of threefold singularities"
    abstract: >-
      Terminal threefold singularities do not always admit crepant resolution (even
      locally!). If we go categorical, such resolutions, once carefully defined, are
      expected to exist. In this talk, I will show an explicit construction for some of
      the simplest singularities, namely, $A_n$, i.e. the ones that are locally given by
      $x^2+y^2+z^2+w^{n+1}$. When $n$ is odd, the resolution has Calabi-Yau kernel
      category. This is a joint work in progress with Fietz and Shinder.
  - date: 2026-05-05

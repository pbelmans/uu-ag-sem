  - date: 2026-05-19
    speaker: "Manoy Trip"
    affiliation: "University of Groningen"
    title: "An Inverse Galois Problem for minimal del Pezzo surfaces of degree 1 with conic bundles over finite fields"
    abstract: >-
      We study del Pezzo surfaces of degree 1 over finite fields, which are a class of
      rational surfaces. These surfaces can be divided into 112 types, based on the Galois
      action on the surface. We focus on the 7 types corresponding to surfaces which are both
      minimal and have a conic bundle structure. These types are determined by the
      configuration of the singular fibers of the conic bundle structure. We discuss an answer
      to the following question: for which values of $q$ can each of these configurations
      exist on a del Pezzo surface with conic bundle defined over $\mathbb{F}_q$?

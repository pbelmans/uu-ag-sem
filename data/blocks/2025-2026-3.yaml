  - date: 2026-03-10
    speaker: "Yuki Mizuno"
    affiliation: "Utrecht University"
    title: "Bondal-Orlov’s reconstruction theorem in noncommutative projective geometry"
    abstract: >-
      The (derived) category of coherent sheaves on a scheme encodes rich information
      about the underlying geometry. P. Gabriel showed that for noetherian schemes $X$ and
      $Y$, if $\operatorname{Coh} X$ and $\operatorname{Coh} Y$ are equivalent as abelian
      categories, then $X$ and $Y$ are isomorphic. Furthermore, A. Bondal and D. Orlov
      proved that for smooth projective schemes $X$ and $Y$ with (anti-)ample canonical
      bundles, if $\mathbf{D}^b(\operatorname{Coh} X)$ and
      $\mathbf{D}^b(\operatorname{Coh} Y)$ are equivalent as triangulated categories, then
      $X$ and $Y$ are isomorphic. On the other hand, J.-P. Serre showed that the category
      of coherent sheaves on a projective scheme can be described as the quotient category
      of finitely generated graded modules over the homogeneous coordinate ring by the
      subcategory of torsion modules. Motivated by the results of Gabriel and Serre, the
      quotient category of finitely generated graded modules over a (not necessarily
      commutative) graded ring by the subcategory of torsion modules is called a
      noncommutative projective scheme. In this talk, I will present an analogue of
      Bondal–Orlov’s reconstruction theorem in the setting of noncommutative projective
      geometry.
  - date: 2026-03-17
    speaker: "Dominique Mattei"
    affiliation: "University of Hannover"
    title: "Tate-Shafarevich group of polarized K3 surfaces"
    abstract: >-
      The Tate-Shafarevich group of an elliptic K3 surface $S$ with a section
      parametrizes twists of $S$, that is, other elliptic K3 surfaces that are étale
      locally isomorphic to $S$. By a result of Artin and Tate, this group is in fact
      isomorphic to $\operatorname{Br}(S)$. I will present joint work with D. Huybrechts
      in which we generalize this story in higher dimensions by defining and studying the
      Tate-Shafarevich group of fibrations in Jacobians of curves of arbitrary genus on K3
      surfaces, and its relation to the (special) Brauer group.
  - date: 2026-03-24
    speaker: "George Politopoulos"
    affiliation: "Leiden University"
    title: "Tautological Classes on the Moduli Space of Curves via Spin Structures"
    abstract: >-
      The tautological ring of the moduli space of curves is a subring of its Chow ring.
      Understanding whether naturally defined classes lie in this subring has been a
      fundamental problem in the study of the intersection theory of the moduli space of
      curves. In this talk, we will define Chow classes arising from spin structures on
      curves, that is, square roots of the canonical line bundle, compute them, and prove that
      they are tautological. If time permits, we will also discuss applications to the
      computation of integrals. This talk is based on joint work with Adrien Sauvaget and
      David Holmes, and with Stijn Velstra and Andrei Bud.

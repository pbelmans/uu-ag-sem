  - date: 2026-02-10
    speaker: "Markus Reineke"
    affiliation: "Ruhr University Bochum"
    title: "Quiver moduli and their geometry"
    abstract: >-
      Quiver moduli spaces are algebraic varieties encoding the continuous parameters of
      linear algebra type classification problems. In recent years their topological and
      geometric properties have been explored, and applications to, among others,
      Donaldson-Thomas and Gromov-Witten theory have emerged. The first aim of the lectures is
      to motivate the study of quiver moduli spaces from the point of view of representation
      theory, to review their construction via Geometric Invariant Theory, and to discuss
      several classes of examples. We will proceed by reviewing results on the topology and
      geometry of these moduli spaces, in particular their cohomology.
    note: "Third Springer lecture"
  - date: 2026-02-17
    speaker: "Carl Tipler"
    affiliation: "Laboratoire de Mathématiques de Bretagne Atlantique"
    title: "Stable toric sheaves"
    abstract: >-
      In the seventies, Hartshorne proposed several problems regarding the existence of low
      rank vector bundles on projective spaces. In rank 2 and characteristic 0, those bundles
      are notoriously difficult to produce, and Hartshorne conjectured that none should exist
      from dimension seven. In this talk, I will explain some motivations for this conjecture,
      and a new approach to the problem, by mean of toric sheaves.
  - date: 2026-02-24
    note: "Day 2 of workshop on the \"Geometry of quiver moduli\""

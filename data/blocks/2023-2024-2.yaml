  - date: 2024-01-10
    speaker: "Noah Arbesfeld"
    affiliation: "Vienna"
    title: "Computing vertical Vafa-Witten invariants"
    abstract: >-
      I'll present a computation in the algebraic approach to Vafa-Witten invariants of
      projective surfaces, as introduced by Tanaka-Thomas. The invariants are defined using
      moduli spaces of stable Higgs pairs on surfaces and are formed from contributions of
      components. The physical notion of $S$-duality translates to conjectural symmetries
      between these contributions. One component, the "vertical" component, is a nested
      Hilbert scheme on a surface. I'll explain work in preparation with M. Kool and T.
      Laarakker in which we express invariants of this component in terms of a quiver
      variety, the instanton moduli space of torsion-free framed sheaves on
      $\mathbb{P}^2$. As a consequence, we deduce constraints on Vafa-Witten invariants,
      including a formula for the contribution of the vertical component to refined
      invariants in rank 2.
  - date: 2024-01-17
    speaker: "Leo Herr"
    affiliation: "Leiden"
    title: "Concerning Weil restrictions"
    abstract: >-
      We begin with a zoo of examples of Weil restrictions. The main three are: 1) number
      theoretic, 2) jet spaces, and 3) the Kontsevich space of (pre)stable maps. We discuss
      each in their own right, leading to an elementary main theorem which applies to all of
      them. Open questions and doable exercises are emphasized throughout, and input
      encouraged.
  - date: 2024-01-24
    speaker: "Ariyan Javanpeykar"
    affiliation: "Nijmegen"
    title: "Non-density of rational points on algebraic varieties over number fields"
    abstract: >-
      Which varieties over a number field should have a potentially dense set of rational
      points? A naive guess based on Lang's conjectures was made in the early nineties: a
      smooth projective variety over a number field which does not dominate a
      positive-dimensional variety of general type after any etale covering should have a
      dense set of rational points over some large enough number field. This conjecture is
      probably false (and the "correct" conjecture was later formulated by Campana). In joint
      work with Finn Bartsch and Erwan Rousseau we disprove the natural analogue of the
      aforementioned naive conjecture for transcendental-rational points (a notion I will
      explain in this talk). In our proof, we develop the theory of moduli spaces of orbifold
      maps, establish an analogue of Kobayashi-Ochiai's finiteness theorem for dominant maps
      in Campana's orbifold setting, employ Mori's bend-and-break and ultimately rely on
      Faltings's finiteness theorem (formerly Mordell's conjecture).

  - date: 2023-11-15
    speaker: "Felix Thimm"
    affiliation: "University of Oslo"
    title: "Nekrasov's formula for some orbifolds"
    abstract: >-
      Nekrasov's formula computes equivariant $K$-theoretic DT invariants for Hilbert
      schemes of points of toric CY3-folds. We extend this to certain global quotient
      CY3 orbifolds, refining a result of Young to equivariant $K$-theoretic DT theory
      and proving a conjecture by Cirafici. Okounkov's proof of Nekrasov's formula
      combines two techniques. First, the virtual structure sheaves satisfy a certain
      factorization property, which allows us to simplify the general form of the DT
      generating series. Secondly, the rigidity principle allows us to determine the
      remaining unknowns by computing a limit in the equivariant parameters. We will
      explain these techniques in the case of schemes and describe some of the
      modifications to make them work for orbifolds.
    note: "This week also: Intercity Number Theory Seminar in Leiden"
  - date: 2023-11-22
    speaker: "Yannik Schuler"
    affiliation: "Sheffield"
    title: "Equivariant Strings and Gromov-Witten theory"
    abstract: >-
      In the past three decades some of the most exciting developments in enumerative geometry
      were inspired by analogies in mathematical physics. After giving you a crash course on
      how an algebraic geometer should think about (A-model topological) string theory, I will
      make a proposal for a mathematically rigorous formulation of the so called refined
      topological string in the framework of equivariant Gromov-Witten theory on Calabi-Yau
      fivefolds. Moreover, I will present a surprising correspondence between the so called
      Nekrasov-Shatashvili limit for a local surface $K_S$ and the enumeration of
      tangents to a smooth anti-canonical curve in $S$ (assuming the latter exist).
      This is ongoing work with Andrea Brini.
    note: "This week also: DIAMANT Symposium"
  - date: 2023-11-29
    speaker: "Tudor Padurariu"
    affiliation: "Max Planck Bonn"
    title: "Quasi-BPS categories for K3 surfaces"
    abstract: >-
      Hyperkahler varieties are higher dimensional analogues of K3 surfaces. Moduli spaces of
      semistable sheaves on a K3 surface for a primitive Mukai vector are examples of
      hyperkahler varieties. Other hyperkahler varieties are obtained as crepant resolutions
      of such moduli spaces when the Mukai vector is not primitive. However, it is known that
      there is only one new example produced in this way, constructed by O’Grady. In joint
      work with Yukinobu Toda, we construct dg categories which are analogues of crepant
      resolutions of singularities for the moduli space of semistable sheaves on a K3 surface
      for a generic stability condition and a general Mukai vector. The construction is
      inspired by the study of BPS invariants in enumerative geometry of Calabi-Yau
      threefolds.

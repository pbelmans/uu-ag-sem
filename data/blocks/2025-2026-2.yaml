  - date: 2026-01-27
    speaker: "Martin Bright"
    affiliation: "Leiden University"
    title: "Wild Brauer groups and rational points"
    abstract: >-
      The behaviour of rational points on a variety is strongly influenced by its geometry.
      For example, one can ask questions about so-called “local-global” principles, and the
      answers to these questions depend on the geometry of the variety. One way in which this
      link manifests itself is through the Brauer group. With Rachel Newton we studied the
      “wild” part of the Brauer group and proved the surprising fact that every variety over a
      number field admitting a non-zero global 2-form and having a prime of good ordinary
      reduction fails weak approximation, possibly after a finite extension of the base field.
      I will describe this result and more recent developments by Ambrosi, Newton and Pagano.

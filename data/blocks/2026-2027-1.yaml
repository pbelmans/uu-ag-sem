  - date: 2026-09-10
    speaker: "Ben Young"
    affiliation: "University of Oregon"
    title: "The equivariant vertex measure is not a probability measure"
    abstract: >-
      This is a combinatorial talk about certain measures on 2D and 3D partitions - the equivariant vertex and edge measures in Donaldson-Thomas theory (I will only talk about the combinatorics, not the geometry).
      For the edge measure, we sketch a purely combinatorial proof that the measure is the Jack-Plancherel measure on integer partitions (a well-studied probability measure).
      For the vertex measure, we will see that only in the Calabi-Yau specialization is the measure positive.
      This is joint work with Kyla Pohl.
  - date: 2026-09-17
    speaker: "Ruxandra Moraru"
    affiliation: "University of Waterloo"
    title: "Moduli spaces of sheaves on primary Kodaira surfaces"
    abstract: >-
      Primary Kodaira surfaces are compact complex surfaces with Kodaira dimension zero, odd first Betti number, and trivial canonical bundle.
      Consequently, they admit holomorphic symplectic structures, i.e., closed non-degenerate holomorphic 2-forms.
      Together with K3 surfaces and complex two-dimensional tori, they are the only compact complex surfaces carrying such structures.
      By Mukai's construction, holomorphic symplectic forms on these surfaces induce holomorphic symplectic structures on moduli spaces of sheaves.
      For suitable topological invariants, these moduli spaces become higher-dimensional compact holomorphic symplectic manifolds.
      In this talk, I will discuss the geometry of moduli spaces of sheaves on primary Kodaira surfaces and present examples of compact moduli spaces that yield new higher-dimensional compact holomorphic symplectic manifolds.
  - date: 2026-09-24
    speaker: "Felix Thimm"
    affiliation: "University of British Columbia"
    title: "Universal Curve Counting on Calabi–Yau 4-folds"
    abstract: >-
      Pardon recently established a type of "cohomology ring of enumeration problems" that all reasonable curve counting theories pair with to produce their invariants.
      A technical regularization procedure then allows him to prove that, for 3-folds, this ring is generated by local curve elements in the relevant degrees, from which the MNOP correspondence (for primary insertions) between different curve counting theories follows, since it was previously proven in the local curve case.
      Our work extends this framework to the CY4-fold case, which allows us to prove several curve counting conjectures in the CY4 case.
      Among the additional technical difficulties in this case is that a more complicated virtual dimension formula leads to more generators than just local curves.
      In this talk, I will give an overview of this framework and explain the main techniques involved.
      This is joint work with Ivan Karpov.
